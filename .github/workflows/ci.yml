name: Haven Monorepo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Check, Build & Test Workspaces
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run check

      - name: Build all workspaces
        run: npm run build

      - name: Run unit test suite
        run: npm test

      - name: Verify standalone backend packaging
        run: npm run package:backend
