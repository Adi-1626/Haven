name: Haven Monorepo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Check, Build & Test Workspaces
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run check

      - name: Build all workspaces
        run: npm run build

      - name: Check and build landing website
        run: npm run check --workspace=@haven/landing && npm run build:landing

      - name: Run unit test suite
        run: npm test

      - name: Check Windows packaging guards
        run: node --test scripts/package-windows.test.mjs scripts/package-installer.test.mjs

      - name: Install browser for hosted integration tests
        run: npx playwright install chrome

      - name: Test split-origin token authentication and private resources
        run: npm run test:e2e:hosted

      - name: Test landing website in Chrome
        run: npm test --workspace=@haven/landing -- --project=chrome --workers=1

      - name: Verify standalone backend packaging
        run: npm run package:backend
